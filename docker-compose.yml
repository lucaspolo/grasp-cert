services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Loopback apenas: credencial fraca de dev não deve ficar exposta na rede
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ham
      POSTGRES_PASSWORD: ham
      POSTGRES_DB: ham_cert
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
