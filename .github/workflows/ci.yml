name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    env:
      # prisma generate não conecta no banco, mas prisma.config.ts lê a variável
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # mesma versão do runtime na Vercel
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm prisma generate && npx tsc --noEmit

      - name: Testes
        run: pnpm test
